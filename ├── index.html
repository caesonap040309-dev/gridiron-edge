<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gridiron Edge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏈 Gridiron Edge</h1>
        <p>College Football Predictions</p>
    </header>

    <main>

        <section class="hero">
            <h2>Today's Best Bets</h2>
            <p>Data-driven college football predictions.</p>
        </section>

        <section id="games">

            <div class="game-card">

                <h2>Texas vs Ohio State</h2>

                <div class="prediction">
                    <span>Overall</span>
                    <strong>68%</strong>
                </div>

                <div class="prediction">
                    <span>Spread</span>
                    <strong>Texas +2.5</strong>
                </div>

                <div class="prediction">
                    <span>Over / Under</span>
                    <strong>Under 52.5</strong>
                </div>

                <div class="prediction">
                    <span>Projected Score</span>
                    <strong>Texas 27 - Ohio State 24</strong>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
