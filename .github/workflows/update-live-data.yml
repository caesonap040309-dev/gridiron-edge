name: Update live football data
# Recheck corrected ODDS_API_KEY
# Multi-book feed activates when the repository secret is present.
# Confidence health reports enabled.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-data.mjs"
      - "scripts/update-nfl-data.mjs"
      - "scripts/team-performance.mjs"
      - "scripts/merge-nfl-books.mjs"
      - "scripts/update-props.mjs"
      - "scripts/grade-props.mjs"
      - "scripts/calibrate-model.mjs"
      - "scripts/audit-model.mjs"
      - "scripts/model-context.mjs"
      - "scripts/team-enrichment.mjs"
      - "scripts/validate-model.mjs"
      - "scripts/production-evaluation.mjs"
      - "scripts/betting-policy.mjs"
      - "scripts/calibration-fit.mjs"
      - "scripts/prop-statistics.mjs"
      - "scripts/market-quotes.mjs"
      - "scripts/market-signals.mjs"
      - "scripts/update-prediction-markets.mjs"
      - "scripts/promotion-gate.mjs"
      - "scripts/injury-feed.mjs"
      - "betting-policy.js"
      - "tests/**"
      - ".github/workflows/update-live-data.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate model feature logic
        run: node --test tests/*.test.mjs
      - name: Refresh schedules scores and live game lines
        env:
          # Requested updates recheck all completed-game stats and advanced feeds.
          REFRESH_TEAM_STATS: ${{ github.event_name != 'schedule' && '1' || '0' }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          PUBLIC_BETTING_FEED_URL: ${{ secrets.PUBLIC_BETTING_FEED_URL }}
          PUBLIC_BETTING_FEED_TOKEN: ${{ secrets.PUBLIC_BETTING_FEED_TOKEN }}
        run: |
          node scripts/calibrate-model.mjs
          node scripts/update-prediction-markets.mjs
          node scripts/update-data.mjs
          node scripts/update-nfl-data.mjs
          node scripts/merge-nfl-books.mjs
          node scripts/validate-model.mjs
          node scripts/audit-model.mjs
          node scripts/calibrate-model.mjs
      - name: Fetch newly available player props on requested updates
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/update-props.mjs
      - name: Grade player props against final results
        run: |
          node scripts/grade-props.mjs
          node scripts/audit-model.mjs
      - name: Publish changed data
        run: |
          git config user.name "gridiron-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json data/nfl.json data/props-nfl.json data/props-cfb.json data/model-calibration.json data/model-audit.json data/model-health-cfb.json data/model-health-nfl.json data/model-snapshots.json data/model-validation.json data/nfl-enrichment.json data/team-profiles-nfl.json data/team-profiles-cfb.json
          [ ! -f data/prediction-markets.json ] || git add data/prediction-markets.json
          [ ! -f data/college-enrichment.json ] || git add data/college-enrichment.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live football data"
          git pull --rebase origin main
          git push
