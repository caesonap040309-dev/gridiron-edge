name: Update live football data
# Recheck corrected ODDS_API_KEY
# Multi-book feed activates when the repository secret is present.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-data.mjs"
      - "scripts/update-nfl-data.mjs"
      - "scripts/update-props.mjs"
      - ".github/workflows/update-live-data.yml"
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch schedules odds and player props
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node scripts/update-data.mjs
          node scripts/update-nfl-data.mjs
          node scripts/update-props.mjs
      - name: Publish changed data
        run: |
          git config user.name "gridiron-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json data/nfl.json data/props-nfl.json data/props-cfb.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live football data"
          git pull --rebase origin main
          git push
