name: Grade player props

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
  push:
    paths:
      - "data/manual-prop-picks.json"
      - "scripts/grade-props.mjs"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grade completed player props
        run: node scripts/grade-props.mjs
      - name: Publish graded records
        run: |
          git config user.name "gridiron-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/props-nfl.json data/props-cfb.json
          git diff --cached --quiet && exit 0
          git commit -m "Grade completed player props"
          git pull --rebase origin main
          git push
