name: Refresh player props

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-props.mjs"
      - ".github/workflows/update-player-props.yml"
  schedule:
    # Refresh after Saturday ends in Eastern time (00:20 EST / 01:20 EDT Sunday).
    - cron: "20 5 * * 0"
    # Check again daily as sportsbooks release the coming week's markets.
    - cron: "20 13 * * *"
    - cron: "20 17 * * 0,6"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current NFL and college player props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node scripts/update-props.mjs
          node scripts/grade-props.mjs
          node scripts/audit-model.mjs
      - name: Publish updated prop boards
        run: |
          git config user.name "gridiron-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/props-nfl.json data/props-cfb.json data/model-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh player props"
          git pull --rebase origin main
          git push
