name: Refresh player props

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * 0,1,3,5"

permissions:
  contents: write

concurrency:
  group: player-props
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current NFL and college player props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node scripts/update-props.mjs
          node scripts/grade-props.mjs
      - name: Publish updated prop boards
        run: |
          git config user.name "gridiron-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/props-nfl.json data/props-cfb.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh player props"
          git pull --rebase origin main
          git push
